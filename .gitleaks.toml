# Extend the default gitleaks rules. Test fixtures and the smoke script use
# obviously fake keys (fitsm_TESTKEY..., fitsm_smoketest...).
[extend]
useDefault = true

[allowlist]
description = "Fake keys used only in mocked tests and the offline smoke script"
paths = ['''(src|dist)/__tests__/.*\.test\.(ts|js)''', '''scripts/smoke\.mjs''']
